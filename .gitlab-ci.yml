# GitLab Pages deployment pipeline
image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html robots.txt sitemap.xml site.webmanifest CNAME LICENSE LICENSE.md public/ 2>/dev/null || cp index.html robots.txt sitemap.xml site.webmanifest public/
    - cp -r assets public/
    - cp -r downloads public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
